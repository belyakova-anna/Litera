services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      LITERA_PASSWORD: ${LITERA_PASSWORD:-litera}
      SESSION_SECRET: ${SESSION_SECRET:-litera-docker-session-secret-change-me}
      DATABASE_URL: sqlite:////app/data/litera.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    volumes:
      - litera-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${LITERA_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  litera-data:
